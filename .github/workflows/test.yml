name: Tests

# Runs the plan generator and setup wizard tests (7,000+ generated plans, both languages).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
    paths: ["index.html", "tools/**", ".github/workflows/test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        working-directory: tools
        run: npm install
      - name: Run tests
        working-directory: tools
        run: npm test
