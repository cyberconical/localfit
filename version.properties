# Version of the next release. Read by tools/build-android.sh (CI and F-Droid).
# versionName: the release tag without the "v" (tag v0.3.2 -> 0.3.2).
# versionCode: (major * 10000 + minor * 100 + patch) * 1000, e.g. 0.3.2 -> 302000.
#   The factor 1000 leaves room for the test builds of branch dev, which use versionCode + build number,
#   so a test build always installs over the last release and the next release over every test build.
# The CI checks that both values and the release tag match. Change them together when you start a new version.
versionName=0.3.3
versionCode=303000
